name: check-do-not-merge

# Emits the `do-not-merge` status-check context the `master-protection` ruleset
# requires. Without this workflow the required check never runs and pends forever,
# blocking every merge.

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, ready_for_review]

jobs:
  do-not-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Check for do-not-merge label
        env:
          PR_LABELS: ${{ toJson(github.event.pull_request.labels) }}
        run: |
          # Parse with jq, not grep. toJson pretty-prints the payload as
          # `"name": "do-not-merge"` (space after the colon), so a
          # `grep '"name":"do-not-merge"'` never matches and this gate would pass
          # with the label applied — a required check that always reports green.
          if echo "$PR_LABELS" | jq -e 'any(.[]; .name == "do-not-merge")' >/dev/null; then
            echo "::error::Merge blocked by the do-not-merge label"
            exit 1
          fi
          echo "No do-not-merge label — merge allowed"
