name: test

# Emits the `test` status-check context the `master-protection` ruleset requires on
# this public repo. The repo carried no CI at all before this file, which is why
# `make precommit` was red on master with two gosec findings and nothing noticed.
#
# `make precommit` rather than `make test`: the local gate is tidy + format + lint +
# test, and a CI that runs only the test target would report green on a tree the
# operator's own gate rejects.

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: precommit
        run: make precommit
